name: Send daily event digest

"on":
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview matching events without sending email
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "23 8 * * *"
      timezone: "America/Lima"

permissions:
  contents: read

concurrency:
  group: daily-event-digest
  cancel-in-progress: false

jobs:
  daily-digest:
    name: Select and email new events
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      DIGEST_RECIPIENT_EMAILS: ${{ secrets.DIGEST_RECIPIENT_EMAILS }}
      DIGEST_CATEGORIES: ${{ vars.DIGEST_CATEGORIES }}
      DIGEST_TAGS: ${{ vars.DIGEST_TAGS }}
      DIGEST_CITIES: ${{ vars.DIGEST_CITIES }}
      DIGEST_MODALITIES: ${{ vars.DIGEST_MODALITIES }}
      DIGEST_ORGANIZATIONS: ${{ vars.DIGEST_ORGANIZATIONS }}
      DIGEST_KEYWORDS: ${{ vars.DIGEST_KEYWORDS }}
      DIGEST_FREE_ONLY: ${{ vars.DIGEST_FREE_ONLY || 'false' }}
      DIGEST_LOOKBACK_HOURS: ${{ vars.DIGEST_LOOKBACK_HOURS || '48' }}
      DIGEST_MAX_EVENTS: ${{ vars.DIGEST_MAX_EVENTS || '20' }}
      DIGEST_SITE_URL: https://recopilar-link.pages.dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Validate Supabase secrets
        shell: bash
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_SECRET_KEY" ]]; then
            echo "Missing SUPABASE_URL or SUPABASE_SECRET_KEY." >&2
            exit 1
          fi

      - name: Validate Gmail secrets for a real send
        if: github.event_name == 'schedule' || inputs.dry_run == false
        shell: bash
        run: |
          if [[ -z "$GMAIL_SENDER_EMAIL" ]]; then
            echo "Missing repository secret: GMAIL_SENDER_EMAIL" >&2
            exit 1
          fi
          if [[ -z "$GMAIL_APP_PASSWORD" ]]; then
            echo "Missing repository secret: GMAIL_APP_PASSWORD" >&2
            exit 1
          fi
          if [[ -z "$DIGEST_RECIPIENT_EMAILS" ]]; then
            echo "Missing repository secret: DIGEST_RECIPIENT_EMAILS" >&2
            exit 1
          fi

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -p no:cacheprovider

      - name: Preview digest
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: python -m backend.scripts.send_daily_digest --dry-run --preview 20

      - name: Send digest
        if: github.event_name == 'schedule' || inputs.dry_run == false
        run: python -m backend.scripts.send_daily_digest --preview 20

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## TechEvents Peru daily digest"
            echo
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Schedule: daily at 08:23 (America/Lima)"
            echo "- Dry run: ${{ inputs.dry_run || false }}"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

